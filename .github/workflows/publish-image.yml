name: publish image

# Builds the sandbox image in CI and pushes it to GHCR, so the image can be
# pulled instead of rebuilt on every machine. GITHUB_TOKEN is scoped per-run by
# the permissions block below — no personal access token is involved.

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # arm64 emulation, so an Apple Silicon machine can pull the same tag.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=opencode-sandbox
            org.opencontainers.image.description=opencode on the Token Harbor gateway, in a hardened container

      # Context is the repo root so the default config can be baked in;
      # .dockerignore whitelists what may enter, so .env cannot.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
